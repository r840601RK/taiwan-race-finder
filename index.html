<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>台灣耐力賽事查詢</title>
  <style>
    :root {
      --bg: #f5f7f4;
      --panel: #ffffff;
      --ink: #18211f;
      --muted: #65706b;
      --line: #d9e1dc;
      --green: #176b54;
      --green-dark: #0d4638;
      --amber: #c87c18;
      --blue: #24659a;
      --red: #b64a3c;
      --shadow: 0 14px 34px rgba(24, 33, 31, 0.11);
      font-family: "Microsoft JhengHei", "Noto Sans TC", system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      background: var(--bg);
      color: var(--ink);
    }

    button, input, select {
      font: inherit;
    }

    button {
      cursor: pointer;
    }

    .app-shell {
      min-height: 100vh;
      display: grid;
      grid-template-columns: 290px 1fr;
    }

    aside {
      background: #122620;
      color: #f7fbf8;
      padding: 26px 20px;
      position: sticky;
      top: 0;
      height: 100vh;
      overflow: auto;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 28px;
    }

    .brand-mark {
      width: 42px;
      height: 42px;
      border-radius: 8px;
      background: #e5f4e8;
      color: var(--green-dark);
      display: grid;
      place-items: center;
      font-weight: 900;
      letter-spacing: 0;
    }

    .brand h1 {
      font-size: 21px;
      line-height: 1.2;
      margin: 0;
    }

    .brand p {
      margin: 3px 0 0;
      color: #b9c8c1;
      font-size: 13px;
    }

    .filter-group {
      border-top: 1px solid rgba(255,255,255,0.13);
      padding-top: 18px;
      margin-top: 18px;
    }

    .filter-group label {
      display: block;
      color: #c6d4cf;
      font-size: 13px;
      margin-bottom: 8px;
    }

    .filter-group input,
    .filter-group select {
      width: 100%;
      border: 1px solid rgba(255,255,255,0.18);
      border-radius: 8px;
      background: #19332b;
      color: white;
      padding: 11px 12px;
      outline: none;
    }

    .segmented {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 6px;
      background: #0d1f1a;
      border-radius: 8px;
      padding: 5px;
    }

    .segmented button {
      min-height: 37px;
      border: 0;
      border-radius: 6px;
      background: transparent;
      color: #dce7e2;
      font-size: 14px;
    }

    .segmented button.active {
      background: #e5f4e8;
      color: #0d4638;
      font-weight: 800;
    }

    .check-row {
      display: flex;
      align-items: center;
      gap: 9px;
      color: #dce7e2;
      font-size: 14px;
      margin-top: 10px;
    }

    .check-row input {
      width: 17px;
      height: 17px;
      accent-color: #e5f4e8;
    }

    .side-actions {
      display: grid;
      gap: 10px;
      margin-top: 22px;
    }

    .side-actions button {
      border: 1px solid rgba(255,255,255,0.2);
      background: transparent;
      color: #f7fbf8;
      border-radius: 8px;
      padding: 11px 12px;
      text-align: left;
    }

    main {
      padding: 28px clamp(18px, 4vw, 44px) 40px;
      min-width: 0;
    }

    .topbar {
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 18px;
      align-items: end;
      margin-bottom: 22px;
    }

    .intro h2 {
      font-size: clamp(28px, 3.4vw, 44px);
      margin: 0 0 8px;
      letter-spacing: 0;
    }

    .intro p {
      color: var(--muted);
      max-width: 780px;
      margin: 0;
      line-height: 1.7;
    }

    .quick-stats {
      display: grid;
      grid-template-columns: repeat(3, minmax(96px, 1fr));
      gap: 10px;
      min-width: 330px;
    }

    .stat {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 14px;
      box-shadow: 0 8px 20px rgba(24, 33, 31, 0.05);
    }

    .stat b {
      display: block;
      font-size: 25px;
      line-height: 1;
      margin-bottom: 6px;
    }

    .stat span {
      color: var(--muted);
      font-size: 13px;
    }

    .toolbar {
      display: grid;
      grid-template-columns: 1fr auto auto;
      gap: 10px;
      margin-bottom: 16px;
    }

    .search-box {
      position: relative;
    }

    .search-box input {
      width: 100%;
      height: 46px;
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 0 14px 0 42px;
      background: var(--panel);
      color: var(--ink);
      outline: none;
    }

    .search-box span {
      position: absolute;
      left: 14px;
      top: 11px;
      color: var(--muted);
    }

    .toolbar select,
    .primary-btn {
      height: 46px;
      border-radius: 8px;
      border: 1px solid var(--line);
      background: var(--panel);
      color: var(--ink);
      padding: 0 13px;
    }

    .primary-btn {
      border-color: var(--green);
      background: var(--green);
      color: #fff;
      font-weight: 800;
    }

    .tabs {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      margin: 12px 0 18px;
    }

    .tabs button {
      border: 1px solid var(--line);
      background: var(--panel);
      border-radius: 999px;
      padding: 8px 13px;
      color: var(--muted);
    }

    .tabs button.active {
      background: #dfeee5;
      border-color: #9bc2aa;
      color: var(--green-dark);
      font-weight: 800;
    }

    .layout {
      display: grid;
      grid-template-columns: minmax(0, 1fr) 330px;
      gap: 18px;
      align-items: start;
    }

    .table-wrap,
    .planner,
    dialog {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 8px;
      box-shadow: var(--shadow);
    }

    .table-wrap {
      overflow: hidden;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      table-layout: fixed;
    }

    thead {
      background: #eef3ef;
    }

    th, td {
      text-align: left;
      padding: 13px 14px;
      border-bottom: 1px solid var(--line);
      vertical-align: top;
    }

    th {
      color: #49534f;
      font-size: 13px;
      white-space: nowrap;
    }

    tbody tr {
      transition: background 0.15s ease;
    }

    tbody tr:hover {
      background: #f8fbf8;
    }

    td {
      line-height: 1.45;
      font-size: 14px;
    }

    .event-name {
      font-weight: 900;
      color: var(--ink);
      margin-bottom: 5px;
    }

    .event-meta {
      color: var(--muted);
      font-size: 13px;
    }

    .pill {
      display: inline-flex;
      align-items: center;
      min-height: 25px;
      border-radius: 999px;
      padding: 3px 9px;
      font-size: 12px;
      font-weight: 800;
      white-space: nowrap;
    }

    .pill.run { background: #e8f4ee; color: var(--green-dark); }
    .pill.bike { background: #e8f0f8; color: #174f7a; }
    .pill.open { background: #f8ecd8; color: #8a4a00; }
    .pill.soon { background: #f4e4df; color: #8f3327; }
    .pill.info { background: #eceff2; color: #45515c; }

    .distance-list {
      display: flex;
      gap: 6px;
      flex-wrap: wrap;
    }

    .distance-chip {
      border: 1px solid var(--line);
      border-radius: 7px;
      padding: 4px 7px;
      background: #fafcfb;
      font-size: 12px;
    }

    .row-actions {
      display: flex;
      gap: 6px;
      justify-content: flex-end;
    }

    .icon-btn {
      width: 34px;
      height: 34px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: white;
      color: var(--ink);
      display: grid;
      place-items: center;
    }

    .icon-btn.saved {
      background: var(--green);
      border-color: var(--green);
      color: white;
    }

    .planner {
      padding: 18px;
      position: sticky;
      top: 20px;
    }

    .planner h3 {
      margin: 0 0 12px;
      font-size: 18px;
    }

    .saved-list {
      display: grid;
      gap: 10px;
      min-height: 80px;
    }

    .saved-item {
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 10px;
      background: #fbfcfb;
    }

    .saved-item b {
      display: block;
      font-size: 14px;
      margin-bottom: 5px;
    }

    .saved-item span {
      color: var(--muted);
      font-size: 13px;
    }

    .empty {
      color: var(--muted);
      padding: 22px;
      text-align: center;
    }

    dialog {
      width: min(720px, calc(100% - 28px));
      padding: 0;
      color: var(--ink);
    }

    dialog::backdrop {
      background: rgba(8, 15, 13, 0.45);
    }

    .modal-head {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 18px 20px;
      border-bottom: 1px solid var(--line);
    }

    .modal-head h3 {
      margin: 0;
    }

    .form-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 14px;
      padding: 20px;
    }

    .form-grid label {
      display: grid;
      gap: 7px;
      color: var(--muted);
      font-size: 13px;
    }

    .form-grid input,
    .form-grid select,
    .form-grid textarea {
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 10px;
      color: var(--ink);
      min-width: 0;
    }

    .form-grid textarea {
      min-height: 88px;
      resize: vertical;
    }

    .span-2 {
      grid-column: span 2;
    }

    .modal-actions {
      display: flex;
      justify-content: flex-end;
      gap: 10px;
      padding: 0 20px 20px;
    }

    .ghost-btn {
      border: 1px solid var(--line);
      background: white;
      border-radius: 8px;
      padding: 10px 13px;
    }

    a {
      color: var(--blue);
      text-decoration: none;
      font-weight: 700;
    }

    .source-note {
      margin-top: 18px;
      color: var(--muted);
      line-height: 1.7;
      font-size: 13px;
    }

    @media (max-width: 1050px) {
      .app-shell {
        grid-template-columns: 1fr;
      }

      aside {
        position: static;
        height: auto;
      }

      .side-grid {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 0 18px;
      }

      .layout {
        grid-template-columns: 1fr;
      }

      .planner {
        position: static;
      }
    }

    @media (max-width: 760px) {
      main {
        padding: 22px 14px 30px;
      }

      .topbar,
      .toolbar,
      .side-grid,
      .form-grid {
        grid-template-columns: 1fr;
      }

      .quick-stats {
        min-width: 0;
      }

      table, thead, tbody, tr, th, td {
        display: block;
      }

      thead {
        display: none;
      }

      tbody tr {
        border-bottom: 1px solid var(--line);
        padding: 12px;
      }

      tbody td {
        border: 0;
        padding: 6px 0;
      }

      .row-actions {
        justify-content: flex-start;
      }

      .span-2 {
        grid-column: span 1;
      }
    }
  </style>
</head>
<body>
  <div class="app-shell">
    <aside>
      <div class="brand">
        <div class="brand-mark">TR</div>
        <div>
          <h1>台灣耐力賽事</h1>
          <p>馬拉松 / 公路車查詢</p>
        </div>
      </div>

      <div class="segmented" aria-label="賽事類型">
        <button class="active" data-type="all">全部</button>
        <button data-type="run">路跑</button>
        <button data-type="bike">單車</button>
      </div>

      <div class="side-grid">
        <div class="filter-group">
          <label for="cityFilter">縣市</label>
          <select id="cityFilter"></select>
        </div>
        <div class="filter-group">
          <label for="monthFilter">月份</label>
          <select id="monthFilter"></select>
        </div>
        <div class="filter-group">
          <label for="distanceFilter">距離</label>
          <select id="distanceFilter">
            <option value="all">全部距離</option>
            <option value="short">短程 / 半馬以下</option>
            <option value="middle">中長程</option>
            <option value="long">長程 / 全馬以上</option>
            <option value="ultra">超長距離</option>
          </select>
        </div>
        <div class="filter-group">
          <label for="statusFilter">狀態</label>
          <select id="statusFilter">
            <option value="all">全部狀態</option>
            <option value="報名中">報名中</option>
            <option value="即將開放">即將開放</option>
            <option value="待公告">待公告</option>
          </select>
          <label class="check-row"><input id="savedOnly" type="checkbox">只看已加入行程</label>
        </div>
      </div>

      <div class="side-actions">
        <button id="resetBtn">重設篩選</button>
        <button id="exportBtn">匯出我的行程 CSV</button>
      </div>
    </aside>

    <main>
      <section class="topbar">
        <div class="intro">
          <h2>查詢、比較、安排全台灣賽事</h2>
          <p>用地點、日期、距離和賽事類型快速篩選馬拉松與公路車活動。資料內建常見賽事範例，建議報名前點來源連結確認名額、費用與最新異動。</p>
        </div>
        <div class="quick-stats">
          <div class="stat"><b id="totalCount">0</b><span>符合賽事</span></div>
          <div class="stat"><b id="runCount">0</b><span>路跑</span></div>
          <div class="stat"><b id="bikeCount">0</b><span>單車</span></div>
        </div>
      </section>

      <div class="toolbar">
        <label class="search-box">
          <span>⌕</span>
          <input id="searchInput" type="search" placeholder="搜尋賽事名稱、地點、關鍵字">
        </label>
        <select id="sortSelect">
          <option value="dateAsc">日期由近到遠</option>
          <option value="dateDesc">日期由遠到近</option>
          <option value="distanceDesc">距離由長到短</option>
          <option value="nameAsc">名稱 A-Z</option>
        </select>
        <button class="primary-btn" id="addBtn">新增賽事</button>
      </div>

      <div class="tabs" id="monthTabs"></div>

      <section class="layout">
        <div class="table-wrap">
          <table>
            <thead>
              <tr>
                <th style="width: 32%">賽事名稱</th>
                <th style="width: 14%">類型</th>
                <th style="width: 17%">地點</th>
                <th style="width: 14%">時間</th>
                <th style="width: 15%">公里數</th>
                <th style="width: 8%">行程</th>
              </tr>
            </thead>
            <tbody id="eventRows"></tbody>
          </table>
          <div class="empty" id="emptyState" hidden>沒有符合條件的賽事</div>
        </div>

        <aside class="planner" aria-label="我的行程">
          <h3>我的行程</h3>
          <div class="saved-list" id="savedList"></div>
          <p class="source-note">資料更新基準：2026-06-03。實際賽事日期、組別與報名狀態請以官方公告為準。</p>
        </aside>
      </section>

      <p class="source-note">
        建議資料來源：RaceLink、運動筆記、跑者廣場、CT 自行車、中華民國自行車騎士協會，以及各賽事官方頁。這個工具採用可手動新增的資料模型，適合先當個人賽程表使用。
      </p>
    </main>
  </div>

  <dialog id="eventDialog">
    <form method="dialog" id="eventForm">
      <div class="modal-head">
        <h3>新增賽事</h3>
        <button class="icon-btn" value="cancel" aria-label="關閉">×</button>
      </div>
      <div class="form-grid">
        <label>賽事名稱<input id="newName" required></label>
        <label>類型<select id="newType"><option value="run">路跑</option><option value="bike">單車</option></select></label>
        <label>縣市<input id="newCity" required placeholder="例如：台北市"></label>
        <label>地點<input id="newPlace" required placeholder="例如：市民廣場"></label>
        <label>日期<input id="newDate" type="date" required></label>
        <label>狀態<select id="newStatus"><option>報名中</option><option>即將開放</option><option>待公告</option></select></label>
        <label class="span-2">公里數<textarea id="newDistances" required placeholder="用逗號分隔，例如：42.195, 21, 10"></textarea></label>
        <label class="span-2">來源連結<input id="newUrl" type="url" placeholder="https://"></label>
      </div>
      <div class="modal-actions">
        <button class="ghost-btn" value="cancel">取消</button>
        <button class="primary-btn" value="default">加入</button>
      </div>
    </form>
  </dialog>

  <script>

      { id: "taiwan-kom-summer-2026", type: "bike", name: "夏季武嶺挑戰", city: "南投縣", place: "埔里至武嶺", date: "2026-06-28", distances: [55], status: "待公告", url: "https://www.cyclist.org.tw/" },
      { id: "sun-moon-lake-bike-2026", type: "bike", name: "日月潭 Come! Bikeday", city: "南投縣", place: "日月潭環湖", date: "2026-11-08", distances: [30, 60, 90], status: "待公告", url: "https://www.sunmoonlake.gov.tw/" },
      { id: "formosa-900-2026", type: "bike", name: "臺灣自行車節 Formosa 900", city: "全台灣", place: "環島路線", date: "2026-11-07", distances: [900], status: "即將開放", url: "https://taiwanbike.tw/" },
      { id: "taipei-riverside-bike-2026", type: "bike", name: "台北河濱自行車挑戰", city: "台北市", place: "河濱自行車道", date: "2026-09-13", distances: [25, 50, 100], status: "待公告", url: "https://www.travel.taipei/" },
      { id: "hualien-east-coast-bike-2026", type: "bike", name: "花東海岸公路自行車挑戰", city: "花蓮縣", place: "花蓮至台東海岸線", date: "2026-09-27", distances: [120, 200], status: "待公告", url: "https://www.eastcoast-nsa.gov.tw/" },
      { id: "taiwan-cycling-festival-2026", type: "bike", name: "騎遇福爾摩沙系列活動", city: "全台灣", place: "各縣市自行車路線", date: "2026-10-10", distances: [20, 50, 100], status: "待公告", url: "https://taiwanbike.tw/" },
      { id: "yangmingshan-king-2026", type: "bike", name: "陽明山王公路車挑戰", city: "台北市", place: "陽明山", date: "2026-07-19", distances: [35, 70], status: "待公告", url: "https://www.cyclist.org.tw/" },
      { id: "taichung-bike-classic-2026", type: "bike", name: "台中經典百K自行車挑戰", city: "台中市", place: "后里 / 東勢 / 新社", date: "2026-10-04", distances: [50, 100], status: "待公告", url: "https://www.cyclist.org.tw/" }
    ];

    const customEvents = JSON.parse(localStorage.getItem("customEvents") || "[]");
    let events = [...baseEvents, ...customEvents];
    let activeType = "all";
    let activeMonthTab = "all";
    const saved = new Set(JSON.parse(localStorage.getItem("savedRaceIds") || "[]"));

    const cityFilter = document.querySelector("#cityFilter");
    const monthFilter = document.querySelector("#monthFilter");
    const distanceFilter = document.querySelector("#distanceFilter");
    const statusFilter = document.querySelector("#statusFilter");
    const searchInput = document.querySelector("#searchInput");
    const sortSelect = document.querySelector("#sortSelect");
    const savedOnly = document.querySelector("#savedOnly");
    const eventRows = document.querySelector("#eventRows");
    const emptyState = document.querySelector("#emptyState");
    const monthTabs = document.querySelector("#monthTabs");
    const savedList = document.querySelector("#savedList");
    const dialog = document.querySelector("#eventDialog");
    const form = document.querySelector("#eventForm");

    const monthName = new Intl.DateTimeFormat("zh-TW", { month: "long" });
    const fullDate = new Intl.DateTimeFormat("zh-TW", { year: "numeric", month: "2-digit", day: "2-digit", weekday: "short" });

    function formatDistance(distances) {
      return distances.map(distance => {
        if (distance >= 42 && distance < 43) return "全馬";
        if (distance >= 21 && distance < 22) return "半馬";
        return `${Number(distance.toFixed(1))}K`;
      });
    }

    function distanceBucket(event) {
      const max = Math.max(...event.distances);
      if (max > 200) return "ultra";
      if (max >= 80 || (event.type === "run" && max >= 42)) return "long";
      if (max >= 21) return "middle";
      return "short";
    }

    function eventMonth(event) {
      return event.date.slice(0, 7);
    }

    function initializeFilters() {
      const cities = ["全部縣市", ...new Set(events.map(event => event.city))];
      cityFilter.innerHTML = cities.map((city, index) => `<option value="${index === 0 ? "all" : city}">${city}</option>`).join("");

      const months = ["全部月份", ...new Set(events.map(eventMonth).sort())];
      monthFilter.innerHTML = months.map((month, index) => {
        const label = index === 0 ? month : `${month} ${monthName.format(new Date(`${month}-01T00:00:00`))}`;
        return `<option value="${index === 0 ? "all" : month}">${label}</option>`;
      }).join("");

      const upcomingMonths = ["all", ...[...new Set(events.map(eventMonth).sort())].slice(0, 8)];
      monthTabs.innerHTML = upcomingMonths.map(month => {
        const label = month === "all" ? "全部月份" : `${month.slice(5)}月`;
        return `<button class="${month === activeMonthTab ? "active" : ""}" data-month="${month}">${label}</button>`;
      }).join("");
    }

    function getFilteredEvents() {
      const keyword = searchInput.value.trim().toLowerCase();
      const city = cityFilter.value;
      const month = activeMonthTab !== "all" ? activeMonthTab : monthFilter.value;
      const distance = distanceFilter.value;
      const status = statusFilter.value;

      let filtered = events.filter(event => {
        const text = `${event.name} ${event.city} ${event.place} ${event.status}`.toLowerCase();
        return (activeType === "all" || event.type === activeType)
          && (city === "all" || event.city === city)
          && (month === "all" || eventMonth(event) === month)
          && (distance === "all" || distanceBucket(event) === distance)
          && (status === "all" || event.status === status)
          && (!savedOnly.checked || saved.has(event.id))
          && (!keyword || text.includes(keyword));
      });

      filtered.sort((a, b) => {
        if (sortSelect.value === "dateDesc") return b.date.localeCompare(a.date);
        if (sortSelect.value === "distanceDesc") return Math.max(...b.distances) - Math.max(...a.distances);
        if (sortSelect.value === "nameAsc") return a.name.localeCompare(b.name, "zh-Hant");
        return a.date.localeCompare(b.date);
      });

      return filtered;
    }

    function render() {
      const filtered = getFilteredEvents();
      document.querySelector("#totalCount").textContent = filtered.length;
      document.querySelector("#runCount").textContent = filtered.filter(event => event.type === "run").length;
      document.querySelector("#bikeCount").textContent = filtered.filter(event => event.type === "bike").length;

      eventRows.innerHTML = filtered.map(event => `
        <tr>
          <td>
            <div class="event-name">${event.name}</div>
            <div class="event-meta"><a href="${event.url}" target="_blank" rel="noopener">官方 / 資料來源</a></div>
          </td>
          <td><span class="pill ${event.type}">${event.type === "run" ? "馬拉松 / 路跑" : "公路車 / 單車"}</span></td>
          <td><b>${event.city}</b><div class="event-meta">${event.place}</div></td>
          <td>${fullDate.format(new Date(`${event.date}T00:00:00`))}</td>
          <td><div class="distance-list">${formatDistance(event.distances).map(item => `<span class="distance-chip">${item}</span>`).join("")}</div></td>
          <td>
            <div class="row-actions">
              <button class="icon-btn ${saved.has(event.id) ? "saved" : ""}" data-save="${event.id}" title="加入或移除行程" aria-label="加入或移除行程">${saved.has(event.id) ? "✓" : "+"}</button>
            </div>
          </td>
        </tr>
      `).join("");
      emptyState.hidden = filtered.length !== 0;
      renderSaved();
    }

    function renderSaved() {
      const savedEvents = events.filter(event => saved.has(event.id)).sort((a, b) => a.date.localeCompare(b.date));
      savedList.innerHTML = savedEvents.length
        ? savedEvents.map(event => `<div class="saved-item"><b>${event.name}</b><span>${event.city} · ${fullDate.format(new Date(`${event.date}T00:00:00`))} · ${formatDistance(event.distances).join(" / ")}</span></div>`).join("")
        : `<div class="empty">尚未加入行程</div>`;
    }

    function persistSaved() {
      localStorage.setItem("savedRaceIds", JSON.stringify([...saved]));
    }

    document.querySelectorAll(".segmented button").forEach(button => {
      button.addEventListener("click", () => {
        document.querySelectorAll(".segmented button").forEach(item => item.classList.remove("active"));
        button.classList.add("active");
        activeType = button.dataset.type;
        render();
      });
    });

    monthTabs.addEventListener("click", event => {
      const button = event.target.closest("button");
      if (!button) return;
      activeMonthTab = button.dataset.month;
      document.querySelectorAll("#monthTabs button").forEach(item => item.classList.remove("active"));
      button.classList.add("active");
      render();
    });

    eventRows.addEventListener("click", event => {
      const button = event.target.closest("[data-save]");
      if (!button) return;
      const id = button.dataset.save;
      if (saved.has(id)) saved.delete(id);
      else saved.add(id);
      persistSaved();
      render();
    });

    [cityFilter, monthFilter, distanceFilter, statusFilter, searchInput, sortSelect, savedOnly].forEach(control => {
      control.addEventListener("input", render);
    });

    monthFilter.addEventListener("input", () => {
      activeMonthTab = "all";
      document.querySelectorAll("#monthTabs button").forEach(item => item.classList.toggle("active", item.dataset.month === "all"));
    });

    document.querySelector("#resetBtn").addEventListener("click", () => {
      activeType = "all";
      activeMonthTab = "all";
      document.querySelectorAll(".segmented button").forEach(item => item.classList.toggle("active", item.dataset.type === "all"));
      searchInput.value = "";
      cityFilter.value = "all";
      monthFilter.value = "all";
      distanceFilter.value = "all";
      statusFilter.value = "all";
      savedOnly.checked = false;
      document.querySelectorAll("#monthTabs button").forEach(item => item.classList.toggle("active", item.dataset.month === "all"));
      render();
    });

    document.querySelector("#exportBtn").addEventListener("click", () => {
      const rows = events.filter(event => saved.has(event.id));
      const csv = ["賽事名稱,類型,縣市,地點,日期,公里數,狀態,來源"].concat(rows.map(event => [
        event.name,
        event.type === "run" ? "路跑" : "單車",
        event.city,
        event.place,
        event.date,
        formatDistance(event.distances).join("/"),
        event.status,
        event.url
      ].map(value => `"${String(value).replaceAll('"', '""')}"`).join(","))).join("\n");
      const blob = new Blob(["\ufeff" + csv], { type: "text/csv;charset=utf-8" });
      const url = URL.createObjectURL(blob);
      const link = document.createElement("a");
      link.href = url;
      link.download = "taiwan-race-plan.csv";
      link.click();
      URL.revokeObjectURL(url);
    });

    document.querySelector("#addBtn").addEventListener("click", () => dialog.showModal());

    form.addEventListener("submit", event => {
      if (event.submitter?.value === "cancel") return;
      event.preventDefault();
      const newEvent = {
        id: `custom-${Date.now()}`,
        name: document.querySelector("#newName").value.trim(),
        type: document.querySelector("#newType").value,
        city: document.querySelector("#newCity").value.trim(),
        place: document.querySelector("#newPlace").value.trim(),
        date: document.querySelector("#newDate").value,
        status: document.querySelector("#newStatus").value,
        distances: document.querySelector("#newDistances").value.split(",").map(item => Number(item.trim())).filter(Boolean),
        url: document.querySelector("#newUrl").value.trim() || "#"
      };
      customEvents.push(newEvent);
      localStorage.setItem("customEvents", JSON.stringify(customEvents));
      events = [...baseEvents, ...customEvents];
      initializeFilters();
      form.reset();
      dialog.close();
      render();
    });

    initializeFilters();
    render();
  </script>
</body>
</html>
